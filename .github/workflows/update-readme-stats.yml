name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"   
  workflow_dispatch:      

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Hyochan02&show_icons=true&hide_border=true&bg_color=000000&title_color=B0F7FF&icon_color=A5DEFD&text_color=FFFFFF&ring_color=9BC6FB
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "chore: update README stats card" || echo "No changes to commit"
          git push
